[workspace]
resolver = "2"
members = [
    "crates/monkey-core",
    "crates/monkey-engine",
    "crates/monkey-github",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
monkey-core = { path = "crates/monkey-core" }
monkey-engine = { path = "crates/monkey-engine" }
monkey-github = { path = "crates/monkey-github" }
axum = "0.8"
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"
thiserror = "2"
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.12"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[package]
name = "monkey"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Self-hosted GitHub issue triage bot"

[lib]
path = "src/monkey.rs"

[dependencies]
monkey-core = { workspace = true }
monkey-engine = { workspace = true }
monkey-github = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }

[profile.release]
lto = "thin"
strip = true
