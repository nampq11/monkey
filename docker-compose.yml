services:
  monkey:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Orchestrator must NEVER see the token (README trust boundary). .env
      # supplies GITHUB_TOKEN for the proxy; override it to empty here so the
      # orchestrator's mode-exclusive auth check doesn't see both proxy + PAT.
      GITHUB_TOKEN: ""
    volumes:
      - monkey-data:/data
      # pi reads ~/.pi/agent/models.json for providers/api keys (chosen: mount
      # host config so the container can call the LLM). Keys/creds live on the
      # host; only the monkey service (which spawns pi) needs this.
      - /home/nampq/.pi/agent/models.json:/root/.pi/agent/models.json:ro
      # pi reads ~/.pi/agent/auth.json for OAuth/API keys (zai, openai-codex,
      # antigravity, etc.). Mounted read-only so the engine can call providers.
      - /home/nampq/.pi/agent/auth.json:/root/.pi/agent/auth.json:ro
    depends_on:
      - gh-proxy
    networks:
      - monkey-internal
      - egress
    ports:
      # Only the webhook endpoint should be reachable externally. Use a reverse
      # proxy that routes ONLY /webhook/github here.
      - "8000:8000"

  gh-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      MONKEY_GH_PROXY_HMAC_KEY: ${MONKEY_GH_PROXY_HMAC_KEY}
    command: python -m monkey.cli gh-proxy
    volumes:
      # gh-proxy runs `git push` on the issue worktrees, so it needs the same
      # workspaces volume the orchestrator mounts (token stays in gh-proxy).
      - monkey-data:/data
    networks:
      - monkey-internal
      - egress
    # gh-proxy exposes NO host port. It joins egress so it can reach
    # api.github.com while monkey stays isolated on the internal network.

volumes:
  monkey-data:

networks:
  monkey-internal:
    internal: true
  egress:
    # Non-internal bridge so gh-proxy can reach api.github.com. Without this the
    # internal network blocks ALL outbound and gh-proxy could never push/patch.
    driver: bridge
