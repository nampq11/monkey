[project]
name = "monkey"
version = "0.1.0"
description = "Self-hosted GitHub triage bot. Drives a coding-agent engine (pi) per-issue against a git worktree, then writes back to GitHub through a token-holding proxy."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
monkey = "monkey.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monkey"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
